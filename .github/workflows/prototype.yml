name: Feel Lab prototype

on:
  push:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype.yml"
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S prototype -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Simulation tests
        run: build\Release\sim_tests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\Release\feellab.exe dist\
          Copy-Item prototype\README.md dist\

      - uses: actions/upload-artifact@v4
        with:
          name: FeelLab-windows-x64
          path: dist/
          if-no-files-found: error

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run simulation tests (no SDL)
        run: |
          cmake -S prototype -B build -DFEELLAB_BUILD_GAME=OFF
          cmake --build build --parallel
          ./build/sim_tests
